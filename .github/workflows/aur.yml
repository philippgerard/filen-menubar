name: Publish to AUR

# Deliberately keyed off release *publication*, not the tag. build.yml creates
# the release as a draft, and a draft's assets are not downloadable — pushing
# to the AUR on the tag would point users at a URL that 404s until the release
# is published by hand.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 0.1.27 (must already be released)'
        required: true

permissions:
  contents: read

jobs:
  aur:
    name: filen-menubar-bin
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'release' && !github.event.release.prerelease) }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Always execute the validator and renderer from reviewed main code.
          ref: main
          # Need every tag: a workflow_dispatch run starts from the default
          # branch and still has to read LICENSE as of v<version>.
          fetch-depth: 0

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            raw_version="$INPUT_VERSION"
          else
            raw_version="$RELEASE_TAG"
          fi
          version="$(bash packaging/arch/validate-version.sh "$raw_version")"
          printf 'version=%s\n' "$version" >>"$GITHUB_OUTPUT"

      - name: Check out the tagged LICENSE
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: git checkout "v${VERSION}" -- LICENSE

      - name: Render PKGBUILD
        # No local .deb here, so render.sh pulls it from the published release.
        # That is the point: the recorded hash is of the artifact users will
        # actually download.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: packaging/arch/render.sh "$VERSION" "$PWD/archbuild"

      - name: Publish to the AUR
        uses: KSXGitHub/github-actions-deploy-aur@a97f56a8425a7a7f3b8c58607f769c69b089cadb # v3
        with:
          pkgname: filen-menubar-bin
          pkgbuild: ./archbuild/PKGBUILD
          commit_username: Philipp Gerard
          commit_email: philipp.gerard@zeitdenken.de
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ steps.version.outputs.version }}"
          ssh_keyscan_types: rsa,ed25519
