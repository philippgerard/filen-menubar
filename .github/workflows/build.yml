name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Reviewed release version, e.g. 0.1.30'
        required: true

# Branch and pull-request builds run in checks.yml, which has no signing or
# release secrets. Privileged releases must be dispatched from main, and the
# prepare job proves that the selected tag is already contained in that commit.
permissions:
  contents: read

# Cancel in-progress runs when a new run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}

    steps:
      - name: Checkout trusted release workflow
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Validate reviewed release tag
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$(bash packaging/arch/validate-version.sh "$INPUT_VERSION")"
          tag="v${version}"
          commit="$(git rev-parse --verify "${tag}^{commit}")"

          if ! git merge-base --is-ancestor "$commit" "$GITHUB_SHA"; then
            echo "release tag ${tag} is not contained in trusted main commit ${GITHUB_SHA}" >&2
            exit 1
          fi

          printf 'version=%s\n' "$version" >>"$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$commit" >>"$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macOS-arm64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: Linux-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: src-tauri -> target

      - name: Cache and install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
          version: 1.0

      - name: Install dependencies
        run: npm install

      - name: Run checks
        run: npm run check

      - name: Import Apple certificate
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          # Create temporary keychain
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          certificate_path="$RUNNER_TEMP/certificate.p12"

          # Decode certificate
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode -o "$certificate_path"

          # Create and configure keychain
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"

          # Import certificate
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain_path"
          security list-keychain -d user -s "$keychain_path"

      - name: Build Tauri app (macOS with signing)
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Philipp Gérard (7WS855G6D3)"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Notarize and verify macOS release disk image
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          app_path="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Filen Menubar.app"
          dmg_files=(src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)

          [[ -d "$app_path" ]] || {
            echo "macOS application bundle was not produced" >&2
            exit 1
          }
          [[ "${#dmg_files[@]}" -eq 1 ]] || {
            echo "expected exactly one macOS disk image" >&2
            exit 1
          }
          dmg_path="${dmg_files[0]}"

          codesign --verify --deep --strict --verbose=4 "$app_path"
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"

          codesign --verify --verbose=4 "$dmg_path"
          xcrun notarytool submit "$dmg_path" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$dmg_path"
          xcrun stapler validate "$dmg_path"
          spctl --assess --type open \
            --context context:primary-signature \
            --verbose=4 \
            "$dmg_path"

      - name: Build Tauri app (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Upload macOS artifacts
        if: startsWith(matrix.platform, 'macos')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.name }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Upload Linux artifacts
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
          if-no-files-found: error

  arch:
    name: Arch package
    needs: [prepare, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Build where pacman lives, so makepkg and namcap are the real thing.
    #
    # An authenticated pull gets a far higher Docker Hub rate limit than the
    # anonymous per-IP one, which is shared across all Actions runners. The
    # credentials belong here rather than in a docker/login-action step: the
    # job container is pulled during "Initialize containers", before any step
    # of this job runs, so a login step would come too late.
    container:
      image: archlinux:base-devel
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Install container tooling
        run: pacman -Syu --needed --noconfirm git namcap

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Trust the workspace checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Download Linux artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Linux-x64
          path: linux-artifacts

      - name: Render PKGBUILD
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          deb="$(find linux-artifacts -name '*.deb' -print -quit)"
          [[ -n "$deb" ]] || {
            echo "no .deb in the Linux-x64 artifact" >&2
            exit 1
          }
          packaging/arch/render.sh "$VERSION" "$PWD/archbuild" "$deb"
          cat archbuild/PKGBUILD

      - name: Build package
        run: |
          set -euo pipefail
          # makepkg refuses to run as root, and the container is root.
          useradd --create-home builder
          chown -R builder: archbuild
          # --nodeps: this only repacks a prebuilt binary, so pulling the
          # runtime deps into the container would buy nothing.
          runuser -u builder -- \
            bash -c 'cd archbuild && makepkg --noconfirm --nodeps'

      - name: Lint package
        run: |
          set -euo pipefail
          namcap archbuild/PKGBUILD || echo "::warning::namcap flagged the PKGBUILD"
          namcap archbuild/*.pkg.tar.zst || echo "::warning::namcap flagged the package"

      - name: Upload Arch artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Arch-x64
          path: archbuild/*.pkg.tar.zst
          if-no-files-found: error

  release:
    needs: [prepare, build, arch]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          tag_name: v${{ needs.prepare.outputs.version }}
          files: artifacts/**/*
